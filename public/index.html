<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Rondas - Acceso</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <div class="wrap" style="padding-top: 60px;">
    <h1>🔦 Rondas</h1>
    <p class="muted">Control de rondas de vigilancia</p>
    <div class="card">
      <form id="loginForm">
        <div style="margin-bottom: 12px;">
          <label>Usuario</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        </div>
        <div style="margin-bottom: 12px;">
          <label>Contraseña</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <p class="error hidden" id="loginError"></p>
        <button type="submit" class="big">Entrar</button>
      </form>
    </div>
    <p class="muted" style="text-align:center;">
      <a href="setup.html" style="color:inherit;">⚙️ Configurar conexión con el backend</a>
    </p>
  </div>
  <script src="js/api.js?v=3"></script>
  <script>
    if (!Api.getScriptUrl()) {
      location.href = 'setup.html';
    }

    const user = Api.getUser();
    if (user && Api.getToken()) {
      location.href = user.role === 'supervisor' ? 'supervisor.html' : 'guard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      try {
        const data = await Api.call('login', { username, password });
        Api.setSession(data.token, data.user);
        location.href = data.user.role === 'supervisor' ? 'supervisor.html' : 'guard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
