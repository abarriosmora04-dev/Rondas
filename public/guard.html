<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Rondas - Panel del vigilante</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <strong>🔦 Rondas</strong>
    <div class="row">
      <span class="muted" id="userName"></span>
      <button class="secondary" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card" id="shiftCard">
      <h3>Turno</h3>
      <p id="shiftStatus" class="muted">Comprobando...</p>
      <div class="row">
        <button class="ok" id="startShiftBtn" onclick="startShift()">Iniciar turno</button>
        <button class="danger hidden" id="endShiftBtn" onclick="endShift()">Terminar turno</button>
      </div>
    </div>

    <div class="card">
      <div class="row between">
        <h3>Ronda actual</h3>
        <span class="badge" id="roundBadge">-</span>
      </div>
      <p class="muted" id="roundWindow"></p>
      <ul class="checklist" id="checklist"></ul>
      <p class="muted" style="margin-top:10px;">
        Escanea el código QR de cada punto con la cámara del móvil. Se abrirá esta app y se
        registrará automáticamente.
      </p>
    </div>

    <div class="card">
      <button class="danger big" onclick="panic()">🆘 EMERGENCIA</button>
      <p class="muted" style="margin-top:8px;">Avisa inmediatamente al supervisor.</p>
    </div>

    <div class="card">
      <h3>Mis últimos registros</h3>
      <table>
        <thead><tr><th>Hora</th><th>Punto</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const user = requireRole('guard');

    function logout() {
      Api.clearSession();
      location.href = 'index.html';
    }

    if (user) document.getElementById('userName').textContent = user.name;

    async function refreshShift() {
      const currentShift = await Api.call('shifts.current');
      const statusEl = document.getElementById('shiftStatus');
      const startBtn = document.getElementById('startShiftBtn');
      const endBtn = document.getElementById('endShiftBtn');
      if (currentShift) {
        statusEl.textContent = `Turno abierto desde las ${new Date(currentShift.startedAt).toLocaleTimeString('es-ES')} (${currentShift.guardName})`;
        startBtn.classList.add('hidden');
        endBtn.classList.remove('hidden');
      } else {
        statusEl.textContent = 'No hay turno abierto.';
        startBtn.classList.remove('hidden');
        endBtn.classList.add('hidden');
      }
    }

    async function startShift() {
      try {
        await Api.call('shifts.start');
        await refreshShift();
      } catch (e) {
        alert(e.message);
      }
    }

    async function endShift() {
      if (!confirm('¿Seguro que quieres terminar el turno?')) return;
      try {
        await Api.call('shifts.end');
        await refreshShift();
      } catch (e) {
        alert(e.message);
      }
    }

    async function panic() {
      if (!confirm('Se va a avisar al supervisor de una EMERGENCIA. ¿Confirmar?')) return;
      try {
        await Api.call('shifts.panic');
        alert('Aviso enviado.');
      } catch (e) {
        alert(e.message);
      }
    }

    const statusLabels = {
      completa: 'Completa',
      incompleta: 'Incompleta',
      no_iniciada: 'No iniciada',
      sin_configurar: 'Sin puntos configurados',
    };

    async function refreshRound() {
      const data = await Api.call('scans.currentRound');
      const badge = document.getElementById('roundBadge');
      badge.textContent = statusLabels[data.status] || data.status;
      badge.className = `badge ${data.status}`;

      const start = new Date(data.slotStart).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      const end = new Date(data.slotEnd).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('roundWindow').textContent = `Ventana de ${start} a ${end}`;

      const list = document.getElementById('checklist');
      list.innerHTML = '';
      if (data.checkpoints.length === 0) {
        list.innerHTML = '<li class="muted">El supervisor todavía no ha configurado puntos de control.</li>';
      }
      data.checkpoints.forEach((c) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="dot ${c.scanned ? 'done' : 'pending'}"></span> ${c.name}`;
        list.appendChild(li);
      });
    }

    async function refreshHistory() {
      const rows = await Api.call('scans.mine');
      const body = document.getElementById('historyBody');
      body.innerHTML = rows
        .map(
          (r) =>
            `<tr><td>${new Date(r.timestamp).toLocaleString('es-ES')}</td><td>${r.checkpointName}</td></tr>`
        )
        .join('');
    }

    async function refreshAll() {
      try {
        await Promise.all([refreshShift(), refreshRound(), refreshHistory()]);
      } catch (e) {
        console.error(e);
      }
    }

    if (user) {
      refreshAll();
      setInterval(refreshAll, 15000);
    }
  </script>
</body>
</html>
