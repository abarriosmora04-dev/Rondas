name: Publicar en GitHub Pages

on:
  push:
    branches:
      - claude/guard-activity-verification-tz5qvk
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (carpeta public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
# Redeploy forzado: la primera vez el repo tenia Pages en modo "Deploy from
# a branch" (Jekyll), asi que este push re-lanza la publicacion ya con
# Source: GitHub Actions activo.
